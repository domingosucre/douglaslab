# locale = 'en-us'

title = 'The Douglas Lab at UCSF'

enableRobotsTXT = true

disableKinds = ["taxonomy", "term"] # turn off taxonomy terms so template doesnt look for them.

[params]
  og_image = "og_research.png"

[params.org]
  name       = "Douglas Lab"
  logo       = "images/header-logo.png"
  parent     = "University of California, San Francisco"
  parent_url = "https://www.ucsf.edu"
  sameAs     = ["https://posts.dynamic.land/@shawn"]


[permalinks.page]
"pages" = "/:slugorcontentbasename/"


[outputs]
page = [ "html" ]
home = [ "html", "rss", "imagesitemap" ]


[outputFormats.imagesitemap]
  mediaType      = "application/xml"
  baseName       = "imagesitemap"
  isHTML         = false
  notAlternative = true



enableGitInfo = true
[frontmatter]
  lastmod = [":git", "lastmod", "date", "publishDate"]

[sitemap]
  filename = "sitemap.xml"

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false  # or true if you want /en/ prefix

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
#    allow = ['^node$', '^postcss$', '^tailwindcss$']
#    osEnv = ['(?i)^(PATH|APPDATA|HOME|TMPDIR|TEMP|TMP|.*NODE.*|DENO.*)$']

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'


# This markup config is necessary, and
# required by the layouts/shorcode/download.html
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# the following caches is used only by github for github pages
# remove if you change hosting
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
  [[module.mounts]]
    source = "i18n"
    target = "i18n"

[languages.en]
  contentDir = 'content/english'
  locale = "en-US"
  label = "English"
  weight = 10
  [[languages.en.menus.main]]
    identifier = 'research'
    name = 'Research'
    pageRef = '/'
    weight = 1
  [[languages.en.menus.main]]
    identifier = 'people'
    name = 'People'
    pageRef  = '/people/'
    weight = 10
  [[languages.en.menus.main]]
    identifier = 'publications'
    name = 'Publications'
    pageRef  = '/publications/'
    weight = 20
  [[languages.en.menus.main]]
    identifier = 'downloads'
    name = 'Downloads'
    pageRef = '/downloads/'
    weight = 30
  [[languages.en.menus.main]]
    identifier = 'contact'
    name = 'Contact'
    pageRef = '/contact/'
    weight = 40

[languages.es]
  contentDir = 'content/espanol'
  locale = "es-ES"
  label = "Español"
  weight = 20
  [[languages.es.menus.main]]
    identifier = 'research'
    name = 'Investigación'
    pageRef = '/'
    weight = 1
  [[languages.es.menus.main]]
    identifier = 'people'
    name = 'Personas'
    pageRef = '/people/'
    weight = 10
  [[languages.es.menus.main]]
    identifier = 'publications'
    name = 'Publicaciones'
    pageRef = '/publications/'
    weight = 20
  [[languages.es.menus.main]]
    identifier = 'downloads'
    name = 'Descargas'
    pageRef = '/downloads/'
    weight = 30
  [[languages.es.menus.main]]
    identifier = 'contact'
    name = 'Contacto'
    pageRef = '/contact/'
    weight = 40

