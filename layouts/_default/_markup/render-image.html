{{- $dest := .Destination -}} {{- if not (or (hasPrefix $dest "http://")
(hasPrefix $dest "https://") (hasPrefix $dest "//")) -}} {{- $dest =
strings.TrimPrefix "/" $dest | relURL -}} {{- end -}}
<img
  src="{{ $dest }}"
  alt="{{ .Text }}"
  {{
  with
  .Title
  }}title="{{ . }}"
  {{
  end
  }}
/>
