{{- define "metatags" }} {{- partial "metatags.html" . }} {{- end }} {{- define
"main" }}


  <div class="grid grid-cols-12 w-full">
    {{ partial "menu.html" . }}
  </div>

  <div class="w-full  mx-auto">
    <div class="grid grid-cols-12 w-full">

      <!-- left column: thin sliver image -->
      <div class="hidden md:block md:col-span-1 lg:col-span-1 xl:col-span-1"
           style="background-image:url('{{ printf "images/%s" .Params.picture_left | relURL }}');
                  background-repeat:no-repeat;
                  background-position:left top;">
      </div>

      <!-- center -->
      <div class="col-span-12 md:col-span-8 lg:col-span-6 xl:col-span-5 2xl:col-span-5 3xl:col-span-4
                  prose prose-lg max-w-none bg-white p-6">
        {{ .Content }}
      </div>

      <!-- right column: wide artwork image -->
      <div class="hidden md:block md:col-span-3 lg:col-span-5 xl:col-span-6 2xl:col-span-6 3xl:col-span-7"
           style="background-image:url('{{ printf "images/%s" .Params.picture_right | relURL }}');
                  background-repeat:no-repeat;
                  background-position:left top;">
      </div>

    </div>
  </div>


{{- end }}{{/* end main */}}
