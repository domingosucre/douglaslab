

{{- $people := hugo.Data.people -}}

<div class="not-prose flex flex-col gap-6 my-10">
  {{- range $people.current }}
  <div class="grid grid-cols-[auto_1fr] gap-4 items-start">
    <img src="{{ printf "images/portraits/%s" .portrait | relURL }}"
         alt="Portrait of {{ .name }}"
         class="w-24 h-24 rounded-sm object-cover block mb-4 ">
    <div>
      <h4 class="text-lg font-bold">
        {{- if .url }}<a target="_blank" rel="noopener" href="{{ .url }}" class="hover:underline">{{ .name }}</a>{{ else }}{{ .name }}{{ end -}}
      </h4>
      <p class="text-lg ">
        {{ .role }}<br>
        {{- with .email }}{{ . | replaceRE `@` `[at]` }}<br>{{ end -}}
        {{- with .phone }}{{ . }}<br>{{ end -}}
      </p>
    </div>
  </div>
  {{- end }}
</div>


<hr class="my-10 border-gray-300">
